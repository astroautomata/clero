name: publish

# Builds the sdist + wheel and publishes them with PyPI "trusted publishing" (OIDC),
# so no API token is stored in the repo. One-time setup on pypi.org (and test.pypi.org):
#   Account -> Publishing -> Add a new pending publisher:
#     PyPI project name: clero
#     Owner: <GitHub owner of this repo>   Repository: clero
#     Workflow name: publish.yml           Environment: pypi   (testpypi for the test index)
# Then a GitHub Release publishes to PyPI; "Run workflow" publishes to TestPyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
